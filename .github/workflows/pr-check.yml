name: PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Verify public runtime catalog
        run: |
          cp src/data/learning.runtime.ts src/data/learning.ts
      - run: pnpm typecheck
      - run: pnpm export:pages
      - run: node scripts/audit-public-build.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
