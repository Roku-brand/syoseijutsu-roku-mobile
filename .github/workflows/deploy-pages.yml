name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify backend deployment settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing repository secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing repository secret: SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'Missing repository variable: EXPO_PUBLIC_SUPABASE_URL'; exit 1; }
      - name: Apply entitlement migration
        run: |
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%%.supabase.co*}"
          supabase link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all
      - name: Deploy payment and entitlement functions
        run: |
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%%.supabase.co*}"
          supabase functions deploy create-checkout --project-ref "$project_ref"
          supabase functions deploy restore-purchase --project-ref "$project_ref"
          supabase functions deploy access --project-ref "$project_ref"
          supabase functions deploy paid-content --project-ref "$project_ref"
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$project_ref"

  build-and-sync:
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify content sync setting
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing repository secret: SUPABASE_SERVICE_ROLE_KEY'; exit 1; }

      - name: Sync published technique content
        run: node scripts/import-owner-content.mjs

      - name: Recover owner-curated theory links
        run: node scripts/recover-owner-theory-links.mjs

      - name: Prepare public runtime catalog
        run: |
          cp src/data/learning.runtime.ts src/data/learning.ts
          pnpm content:build-public

      - name: Prepare and securely sync complete-edition content
        run: |
          pnpm content:split-secure
          pnpm content:sync-paid

      - name: Validate 356-item master catalog
        run: pnpm content:validate-master336

      - name: Audit curated theory links in both directions
        run: pnpm content:audit-theory-links

      - name: Audit learning curriculum
        run: pnpm content:audit-learning

      - name: Check types
        run: pnpm typecheck

      - name: Export web app
        run: pnpm export:pages

      - name: Audit SEO output
        run: pnpm seo:audit

      - name: Audit public build for paid content
        run: node scripts/audit-public-build.mjs

      - name: Install browser for release smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release smoke test
        run: pnpm test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
