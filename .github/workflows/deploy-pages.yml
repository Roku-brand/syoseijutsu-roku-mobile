name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backend:
        description: 'Skip backend deployment when the migration/functions were already applied manually'
        required: false
        default: 'false'
        type: boolean
      skip_content_sync:
        description: 'Build from the committed catalog when Supabase is temporarily unavailable'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-backend:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_backend != true }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI to avoid latest-release resolution hitting GitHub rate limits.
          version: v2.117.0
      - name: Verify backend deployment settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing repository secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing repository secret: SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'Missing repository variable: EXPO_PUBLIC_SUPABASE_URL'; exit 1; }
      - name: Apply pending database migrations
        run: |
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%%.supabase.co*}"
          encoded_password="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          db_url="postgresql://postgres.${project_ref}:${encoded_password}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --include-all --dry-run
          supabase db push --db-url "$db_url" --include-all
      - name: Deploy backend functions
        run: |
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%%.supabase.co*}"
          supabase functions deploy create-checkout --project-ref "$project_ref"
          supabase functions deploy restore-purchase --project-ref "$project_ref"
          supabase functions deploy access --project-ref "$project_ref"
          supabase functions deploy paid-content --project-ref "$project_ref"
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$project_ref"
          supabase functions deploy delete-account --no-verify-jwt --project-ref "$project_ref"
          supabase functions deploy operations-mcp --no-verify-jwt --project-ref "$project_ref"

  build-and-sync:
    needs: deploy-backend
    if: ${{ always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify content sync setting
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_content_sync != true }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing repository secret: SUPABASE_SERVICE_ROLE_KEY'; exit 1; }

      - name: Sync owner operations data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_content_sync != true }}
        run: pnpm operations:sync

      - name: Prepare public runtime catalog
        run: |
          cp src/data/learning.runtime.ts src/data/learning.ts
          pnpm content:build-public

      - name: Prepare complete-edition catalog and sync learning content
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_content_sync != true }}
        run: |
          pnpm content:split-secure
          pnpm content:sync-paid

      - name: Validate canonical source catalog
        run: pnpm content:validate-master336

      - name: Audit free and complete product scope
        run: pnpm content:audit-scope

      - name: Audit retired quotation content
        run: pnpm content:audit-theory-rights

      - name: Audit curated theory links in both directions
        run: pnpm content:audit-theory-links

      - name: Audit learning curriculum
        run: pnpm content:audit-learning

      - name: Lint source
        run: pnpm lint

      - name: Test practical wisdom contracts
        run: pnpm test:practical-wisdom

      - name: Test canonical theory taxonomy and legacy compatibility
        run: pnpm test:theory-taxonomy

      - name: Check types
        run: pnpm typecheck

      - name: Export web app
        run: pnpm export:pages

      - name: Audit SEO output
        run: pnpm seo:audit

      - name: Audit public build for paid content
        run: node scripts/audit-public-build.mjs

      - name: Bound package download waits
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-download-timeouts > /dev/null

      - name: Install browser for release smoke test
        run: pnpm exec playwright install chromium

      - name: Run release smoke test
        run: pnpm test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-sync
    if: ${{ always() && needs.build-and-sync.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
