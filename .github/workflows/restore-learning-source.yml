name: Restore learning source

on:
  push:
    branches: [secure-paid-content-cutover]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: secure-paid-content-cutover
          fetch-depth: 0
      - name: Restore full learning source from pre-cutover main
        run: |
          if grep -q "learningSource from './generated/learning.json'" src/data/learning.ts; then
            git checkout cbb461e58a8fcff5e78f0e633d7965f72fa98fae -- src/data/learning.ts
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/data/learning.ts
            git commit -m "Restore full learning source for secure split"
            git push origin HEAD:secure-paid-content-cutover
          fi
