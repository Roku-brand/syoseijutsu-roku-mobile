name: Export secure content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate public and paid content files
        run: node scripts/split-public-paid-content.mjs

      - name: Upload secure content export
        uses: actions/upload-artifact@v4
        with:
          name: secure-content-export
          path: dist-secure-content/
          if-no-files-found: error
          retention-days: 7
